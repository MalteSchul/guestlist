[project]
name = "guestlist-backend"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
