[project]
name = "guestlist-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
