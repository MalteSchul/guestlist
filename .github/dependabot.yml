version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # openapi-typescript supports TypeScript 5 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new Node major also needs node-version in ci.yml; bump both together by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Same for Python: requires-python and the uv-managed version move with it.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
