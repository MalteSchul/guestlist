<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Guest links carry a secret token; never send it on as a referrer (A12). -->
    <meta name="referrer" content="no-referrer" />
    <title>Guestlist</title>
    <script>
      // The theme picked with the switch (src/theme.ts), set before the first paint so a
      // choice that differs from the system's doesn't flash.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
